<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pavalia Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="calculator" role="application" aria-label="Calculator">
      <output id="display" class="display" aria-live="polite">0</output>

      <div class="keys">
        <button type="button" class="key key--fn" data-action="clear">AC</button>
        <button type="button" class="key key--fn" data-action="backspace">DEL</button>
        <button type="button" class="key key--op" data-value="/">&divide;</button>
        <button type="button" class="key key--op" data-value="*">&times;</button>

        <button type="button" class="key" data-value="7">7</button>
        <button type="button" class="key" data-value="8">8</button>
        <button type="button" class="key" data-value="9">9</button>
        <button type="button" class="key key--op" data-value="-">&minus;</button>

        <button type="button" class="key" data-value="4">4</button>
        <button type="button" class="key" data-value="5">5</button>
        <button type="button" class="key" data-value="6">6</button>
        <button type="button" class="key key--op" data-value="+">+</button>

        <button type="button" class="key" data-value="1">1</button>
        <button type="button" class="key" data-value="2">2</button>
        <button type="button" class="key" data-value="3">3</button>
        <button type="button" class="key key--equals" data-action="equals" rowspan="2">=</button>

        <button type="button" class="key key--wide" data-value="0">0</button>
        <button type="button" class="key" data-value=".">.</button>
      </div>
    </main>

    <script src="src/calculator.js"></script>
    <script src="src/ui-model.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
